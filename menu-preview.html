<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fallen / RIFT menu preview</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101018;color:#f3f1f9;font:12px Arial,sans-serif;display:grid;place-items:center;overflow:hidden}.scene{position:fixed;inset:0;background:radial-gradient(ellipse at 55% 20%,#8e8893 0,#484450 28%,transparent 55%),linear-gradient(160deg,#252b32 35%,#31303b 37%,#1b1e22 57%,#131513 60%);filter:blur(7px) brightness(.48);transform:scale(1.05)}.scene:before{content:"";position:absolute;inset:30% -10% 0;background:linear-gradient(155deg,transparent 20%,#353836 21%,#1d211f 55%,#131513 56%)}.menu{position:relative;width:590px;height:440px;border-radius:7px;background:rgba(21,22,29,.94);box-shadow:0 20px 70px #000a,0 0 0 1px #ffffff0d;display:grid;grid-template-columns:139px 1fr;overflow:hidden}.side{background:rgba(10,11,15,.9);border-right:1px solid #30303b;padding:20px 8px}.brand{margin:0 11px 27px;font:bold 19px Arial;letter-spacing:.08em}.brand small{display:block;margin-top:4px;color:#8b4bf7;font:10px monospace;letter-spacing:.34em}.nav{display:grid;gap:10px}.nav button{border:0;background:transparent;color:#aaa8b8;text-align:left;height:36px;padding:0 13px;border-radius:5px;font:11px Arial;letter-spacing:.08em;cursor:pointer}.nav button.active{color:white;background:#8b4bf7;box-shadow:0 0 18px #8b4bf744}.nav button:hover:not(.active){background:#272631}.keys{position:absolute;bottom:16px;left:19px;color:#696976;font:9px/18px monospace}.main{min-width:0}.tabs{height:52px;border-bottom:1px solid #30303b;padding:12px 18px;display:flex;gap:12px}.tabs button{border:0;background:transparent;color:#888898;border-radius:15px;padding:0 16px;font:10px Arial;cursor:pointer}.tabs button.active{color:white;background:#8b4bf7}.content{padding:16px 22px}.content h1{font-size:17px;letter-spacing:.07em;margin:0 0 5px}.content p{color:#9393a5;margin:0 0 14px;font-size:10px}.rule{border-bottom:1px solid #363541;margin-bottom:15px}.row{background:#20212c;border-radius:7px;min-height:51px;margin:0 0 7px;padding:10px 13px;display:flex;align-items:center;justify-content:space-between}.row b{display:block;font-size:12px}.row small{display:block;color:#9696a8;font-size:10px;margin-top:4px}.toggle{appearance:none;width:35px;height:20px;background:#4b4a57;border-radius:15px;position:relative;cursor:pointer}.toggle:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;top:3px;left:3px;background:#fff;transition:.15s}.toggle:checked{background:#8b4bf7}.toggle:checked:after{left:18px}.slider{width:120px;accent-color:#8b4bf7}.foot{position:absolute;right:20px;bottom:15px;color:#747484;font:9px monospace;letter-spacing:.1em}.badge{color:#9f76ff;font:bold 10px monospace;margin-top:16px}@media(max-width:650px){body{overflow:auto;padding:12px}.menu{width:min(100%,590px);height:440px;grid-template-columns:110px 1fr}.tabs{gap:2px;padding-left:5px}.tabs button{padding:0 8px}.side{padding-left:2px}.brand{font-size:16px}.nav button{font-size:9px}}
</style></head><body><div class="scene"></div><div class="menu"><aside class="side"><div class="brand">FALLEN<small>RIFT</small></div><nav class="nav"><button data-tab="0">OVERVIEW</button><button data-tab="1">AIMBOT</button><button data-tab="2" class="active">VISUALS</button><button data-tab="3">WORLD</button><button data-tab="4">MISC</button></nav><div class="keys">ALT+CLICK SELECT<br>RSHIFT&nbsp; HIDE<br>END&nbsp;&nbsp;&nbsp;&nbsp; UNLOAD</div></aside><main class="main"><div class="tabs"><button data-tab="0">Home</button><button data-tab="1">Aim</button><button data-tab="2" class="active">Players</button><button data-tab="3">Items</button><button data-tab="4">Settings</button></div><div class="content"><h1 id="title">VISUALS</h1><p>Fallen Survival / external control</p><div class="rule"></div><div id="rows"></div></div></main></div><script>
const tabs=[{title:'OVERVIEW',rows:[['Fallen Survival','Matcha external visual console',null],['Player ESP','Boxes, names, distance and health',true],['Aim assist','Hold right mouse near a target',false]]},{title:'AIMBOT',rows:[['Aim assist','Hold right mouse to engage',false],['Show FOV','Display target selection radius',true],['FOV radius','Screen pixels around crosshair','range'],['Smoothing','Higher is slower','range']]},{title:'VISUALS',rows:[['Player ESP','Master visual toggle',true],['Boxes','Outline player silhouettes',true],['Names + distance','Identify and range targets',true],['Health bars','Show available health value',true],['Snaplines','Lines from lower screen edge',false]]},{title:'WORLD',rows:[['World ESP','Master resource overlay',true],['Nodes','Ore, stone, sulfur and wood',true],['Barrels + crates','Loot containers',true],['Plants','Hemp, berries and crops',true],['Selected glow','Alt + click a marker to focus it',true]]},{title:'MISC',rows:[['Show teammates','Include same-team players',false],['Noclip','Local character collision',false],['Spider climb','Hold W into a wall to rise',false],['Camera FOV','Restore on unload','range'],['World range','Maximum resource distance','range']]}];let current=2;function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',+b.dataset.tab===current));document.querySelector('#title').textContent=tabs[current].title;document.querySelector('#rows').innerHTML=tabs[current].rows.map(([a,b,v])=>`<div class="row"><div><b>${a}</b><small>${b}</small></div>${v===null?'':v==='range'?'<input class="slider" type="range">':`<input class="toggle" type="checkbox" ${v?'checked':''}>`}</div>`).join('')}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{current=+b.dataset.tab;render()});render();
</script></body></html>
